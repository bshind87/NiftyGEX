name: niftygex
channels:
  - conda-forge
dependencies:
  - python=3.11.11
  - numpy=2.1.3
  - polars=1.22.0
  - pyarrow=18.1.0
  - pyyaml=6.0.2
  - scipy=1.14.1
  - pytest=8.3.4
  # Evaluation layer (src/niftygex_eval)
  - scikit-learn=1.5.2
  - statsmodels=0.14.4
  - lightgbm=4.5.0
  - pandas=2.2.3
  - matplotlib-base=3.9.2
  # Neural models (src/niftygex_eval/nn). conda-forge build: shares conda's OpenMP with LightGBM
  # (the pip wheel bundles its own libomp and aborts on import next to it).
  - pytorch=2.10.0
  # Notebooks (notebooks/)
  - ipykernel=6.29.5
  - nbformat=5.10.4
  - nbclient=0.10.2
  - pip
  - pip:
      - ruff==0.9.7
      # Word progress report (scripts/write_progress_report.py)
      - python-docx==1.1.2
