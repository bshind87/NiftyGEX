# Explorer HPC settings for the exploratory neural runs (docs/hpc.md). $USER is expanded on the cluster (shinde.b).
ssh_alias: explorer                      # ~/.ssh/config host alias on the Mac (key-based): sync, setup, jobs, scheduler, status
xfer_alias: explorer-xfer                # alias for RC's transfer node xfer.discovery.neu.edu (data push and results pull)
remote_user: shinde.b
code_dir: /home/$USER/niftygex            # private clone at a commit, via the read-only deploy key (hpc/sync_code.sh)
env_dir: /home/$USER/envs/niftygex
scratch_dir: /scratch/$USER/niftygex      # data/ and outputs/ (configs/paths.hpc.yaml); private (go-rwx); purged each semester
modules: [explorer, anaconda3/2024.06, cuda/12.1.1]
torch: {version: 2.10.0, index_url: https://download.pytorch.org/whl/cu126}

# One GPU type for every job (device rule, configs/eval_exploratory_v2.yaml compute.gpu_type).
gpu_type: v100-sxm2
resources: {mem: 32G, cpus_per_task: 4}

# Routing (hpc/scheduler.py). Short jobs (estimated under 2 h) go to gpu-short; long jobs to gpu so they queue for
# the night. courses-gpu is an extra slot for any job whenever sbatch --test-only estimates an earlier start there.
# A long job still pending on gpu may instead run as chained gpu-short pieces when gpu-short has a free slot and no
# short job is waiting; each piece stops before a walk it cannot finish and the next piece resumes from the
# checkpoints. Limits are running / submitted per partition (RC's table; gpu-short also has a 1-GPU-per-user limit).
partitions:
  gpu-short: {max_running: 2, max_submitted: 4, time: "01:55:00"}
  gpu: {max_running: 4, max_submitted: 8, time: "08:00:00"}
  courses-gpu: {max_running: 1, max_submitted: 1, time: "08:00:00"}
routing:
  short: [gpu-short, courses-gpu]
  long: [gpu, courses-gpu]
  chain_on: gpu-short
  chain_time: "01:50:00"
  chain_max_walk_minutes: 80         # chain a long job only if its walks fit a piece (calibration sets the estimates)
  move_if_earlier_by_minutes: 30     # move a pending gpu job to chained gpu-short pieces if they start this much earlier
deadline_margin_minutes: 8           # a job stops starting walks this long before its time limit
max_attempts: 12                     # submissions per job (pieces, time limits); crashes stop it at once
job_prefix: ngx_
