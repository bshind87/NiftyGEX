# Evaluation-layer configuration (src/niftygex_eval). Separate from the data-layer config hash: changing it
# never invalidates data stages. Every results-store run records both hashes.

harness:
  # Walks are aligned to weekly expiry cycles: a trading day belongs to the cycle of the first option expiry
  # on or after it. Training is expanding (train_window_cycles: null) or rolling, followed by an embargo of
  # embargo_cycles cycles, then test_cycles test cycles. Rows are never shuffled.
  test_cycles: 13
  embargo_cycles: 1
  min_train_cycles: 52
  train_window_cycles: null

results_store: outputs/results

forecast:
  # The proposal's ladder (slides 14-15). Every model predicts log(rv_ratio_trailing) at the T2 15:15
  # snapshot: next-day front-month futures RV over its trailing 20-day mean. Same walks, same test rows.
  target: t2
  outcome: rv_ratio_trailing
  models: [historical_mean, persistence, har, har_gex, lightgbm]
  reference: har            # out-of-sample R² is measured against this model
  # Persistence: log(previous-day RV / trailing 20-day RV), both completed before the snapshot.
  persistence_columns: [rv_trailing_1d_annualized_prev, rv_trailing_20d_annualized_prev]
  # HAR-RV: OLS on logs of daily, weekly and monthly RV through yesterday plus today's RV so far.
  har_columns: [rv_trailing_1d_annualized_prev, rv_trailing_5d_annualized_prev, rv_trailing_20d_annualized_prev,
                rv_intraday_so_far_annualized]
  # HAR + GEX ("+ the one number"): ridge, alpha chosen on the inner split by MSE.
  gex_columns: [gex_norm_naive, gex_norm_absolute, gex_norm_inferred, gex_sign_inferred]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
  # Tuned LightGBM on the summary features. Raw rupee GEX totals and the index level trend with OI growth
  # and are replaced by normalized GEX.
  summary_exclude: [spot, gex_total_naive, gex_total_absolute, gex_total_inferred]
  dm_max_lags: 5
  regime_column: regime_post_weekly_expiry_rationalisation
  # Normalized GEX: total GEX / causal trailing mean of absolute total GEX over prior T2 snapshots.
  gex_normalization: {conventions: [naive, absolute, inferred], window: 250, min_periods: 60}
  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 30
    colsample_bytree: 0.8
    subsample: 1.0
    reg_lambda: 1.0
    random_state: 7
    deterministic: true
    n_jobs: 1
    verbose: -1
  tuning:
    # Inside each walk's training window: inner-train, inner_embargo_cycles, then the last
    # inner_validation_cycles as validation (time-ordered, purged). Settings are chosen there by MSE, then
    # refit on the full training window.
    inner_validation_cycles: 26
    inner_embargo_cycles: 1
    grid:
      min_child_samples: [30, 60, 120]
      max_depth: [3, 5, -1]
      reg_lambda: [1.0, 10.0, 50.0]

neural:
  # Proposal steps 4-6 (src/niftygex_eval/nn): same target, walks and rows as the forecast ladder.
  models: [deepsets, attention, attention_gru]
  window: 12                # snapshots of history L (5 minutes apart, ending at 15:15); ablation: 24, 72
  # Per-contract token fields (data/features/tokens); heavy-tailed ones get sign(x) * log1p(|x|) before scaling.
  token_features: [log_moneyness, is_call, iv, gamma, delta, strike_gex_absolute_crore, strike_gex_naive_crore,
                   open_interest_contracts, oi_change_since_previous_close_pct, volume_today, volume_to_oi,
                   days_to_expiry, time_to_expiry, oi_missing, previous_oi_missing]
  signed_log_features: [strike_gex_absolute_crore, strike_gex_naive_crore, open_interest_contracts, volume_today, volume_to_oi]
  # Volatility-state vector for the model head (one row per day, from the forecast table); positive levels get logs.
  state_columns: [atm_iv, skew_25d, term_slope, rv_intraday_so_far_annualized, rv_trailing_1d_annualized_prev,
                  rv_trailing_5d_annualized_prev, rv_trailing_20d_annualized_prev, vix_previous_close, days_to_expiry,
                  is_expiry_day, gex_norm_naive, gex_norm_absolute, gex_norm_inferred, gex_sign_inferred]
  log_state_columns: [atm_iv, rv_intraday_so_far_annualized, rv_trailing_1d_annualized_prev, rv_trailing_5d_annualized_prev,
                      rv_trailing_20d_annualized_prev, vix_previous_close]
  model: {d_model: 64, heads: 4, layers: 2, ff_dim: 128, dropout: 0.1, gru_hidden: 64, head_hidden: 32}
  training: {huber_delta: 1.0, lr: 0.001, weight_decay: 0.01, batch_size: 32, max_epochs: 200, patience: 20, seeds: [11, 12, 13]}

multiple_testing:
  # Holm within pre-registered families; every other test is exploratory (unadjusted).
  alpha: 0.05
  families:
    # Proposal research questions (forecast section; primary metric IC per walk, paired across the same walks).
    # Fixed before the first neural run; RQ2 and RQ3 are Holm-adjusted within the family. The earlier
    # exploratory families F1-F4 are in archive/configs/eval_exploratory.yaml.
    RQ1: attention + GRU vs each classical rung with a defined IC (persistence, HAR, HAR + GEX, tuned LightGBM; historical mean is constant per walk, so it is an RMSE/QLIKE reference only); mean per-walk IC gain, 95% CI and paired t; a win over the ladder requires every comparison to reject at 5% (intersection-union, no Holm); QLIKE, RMSE, walks won and Diebold-Mariano are supporting
    RQ2: DeepSets vs single-snapshot self-attention (interactions); single-snapshot self-attention vs attention + GRU (history); same paired IC test, Holm within the family; window-length and field-drop ablations are exploratory
    RQ3: per-walk IC gain of attention + GRU over tuned LightGBM, walks after vs before the weekly-expiry rationalisation marker (Welch t); lot-size changes and volatility regimes are exploratory
